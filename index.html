<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lan's Graduation Day 🎓</title>
  
  <!-- Tải ưu tiên trang 1 để vừa bấm link là hiện ra ngay -->
  <link rel="preload" as="image" href="page1.jpg">
  <link rel="prefetch" href="page2.jpg">
  <link rel="prefetch" href="page3.jpg">
  <link rel="prefetch" href="page4.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f7f3ed;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .page-wrapper img.card-page {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Vùng bấm sticker máy ảnh ở Trang 2 */
    .camera-trigger {
      position: absolute;
      top: 17%;
      left: 10%;
      width: 20%;
      height: 8%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Lớp phủ nền mờ khi mở photostrip */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 998;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Khung popup dải ảnh */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-height: 90vh;
    }
    .modal.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .photostrip-img {
      max-height: 78vh;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4));
      border-radius: 6px;
    }

    .close-btn {
      margin-top: 14px;
      background: #ffffff;
      color: #333;
      border: none;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 22px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Trang 1 -->
    <div class="page-wrapper">
      <img class="card-page" src="page1.jpg" alt="Trang 1" fetchpriority="high">
    </div>

    <!-- Trang 2 (Có nút bấm mở popup máy ảnh) -->
    <div class="page-wrapper">
      <img class="card-page" src="page2.jpg" alt="Trang 2">
      <button class="camera-trigger" id="openBtn" title="Xem dải ảnh"></button>
    </div>

    <!-- Trang 3 -->
    <div class="page-wrapper">
      <img class="card-page" src="page3.jpg" alt="Trang 3">
    </div>

    <!-- Trang 4 -->
    <div class="page-wrapper">
      <img class="card-page" src="page4.jpg" alt="Trang 4">
    </div>
  </div>

  <!-- Popup Photostrip -->
  <div class="overlay" id="overlay"></div>
  <div class="modal" id="modal">
    <img class="photostrip-img" src="https://i.ibb.co/d1tY80Y/D-i-nh.png" alt="Dải ảnh kỷ niệm">
    <button class="close-btn" id="closeBtn">Đóng ✕</button>
  </div>

  <script>
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const overlay = document.getElementById('overlay');
    const modal = document.getElementById('modal');

    function openStrip() {
      overlay.classList.add('active');
      modal.classList.add('active');
    }

    function closeStrip() {
      overlay.classList.remove('active');
      modal.classList.remove('active');
    }

    openBtn.addEventListener('click', openStrip);
    closeBtn.addEventListener('click', closeStrip);
    overlay.addEventListener('click', closeStrip);
  </script>
</body>
</html>
